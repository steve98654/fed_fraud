# Optional: deploys the site to Cloudflare Pages from GitHub Actions. Not needed
# if the Pages project is connected to the repo in the Cloudflare dashboard
# (the route in site/HOSTING.md). Manual only.
name: Site deploy

on:
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'geodesic-accountability-office' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the "Last updated" stamps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # Runs from site/ so wrangler also uploads site/functions (the password gate).
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true
