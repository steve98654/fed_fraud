# Deploys the site to Cloudflare Pages, behind Cloudflare Access.
#
# Manual only for now: run it from the Actions tab once the Cloudflare project
# and the Access policy exist (see site/HOSTING.md). Do not add a push trigger
# until the Access gate has been tested, because a deploy without it is public.
name: Site deploy

on:
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'geodesic-accountability-office' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the "Last updated" stamps
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true
